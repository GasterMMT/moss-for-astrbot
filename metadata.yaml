name: astrbot_plugin_moss_voice
desc: 为 AstrBot 接入 MOSS 官方 TTS / STT：moss-tts-1.5-flash / moss-tts-1.0-pro 语音合成，moss-transcribe-1.0 / diarize-pro 音频转写。插件注册 moss_tts / moss_stt 两个服务提供商并支持一键切换默认语音链路；自带单页 WebUI，用于配置、读取账号音色和做最小化调试。
short_desc: MOSS 官方 TTS / STT，单页配置与调试
author: GasterMMT
